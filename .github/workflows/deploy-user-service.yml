name: Deploy User Service to EC2 ApexFit

# ------------------------------------------------------------------------------
# TRIGGER MANAGEMENT
# Pipeline fires automatically when code changes are pushed to 'main' branch 
# within the 'services/user-service/' folder or this workflow file.
# ------------------------------------------------------------------------------
on:
  push:
    branches:
      - main
    paths:
      - 'services/user-service/**'
      - '.github/workflows/deploy-user-service.yml'

jobs:
  # ------------------------------------------------------------------------------
  # CI/CD COMBINED PHASE
  # Runs on a single runner to build, package, transport, and deploy in one flow.
  # ------------------------------------------------------------------------------
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Pull source code
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # Step 2: Configure Node.js runtime
      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/user-service/package-lock.json

      # Step 3: Install dependencies and package release archive
      - name: Build & Package Application Archive
        run: |
          echo "==> [Step 1/3] Pruning devDependencies and packaging application..."
          cd services/user-service
          npm ci --omit=dev
          tar -czf ../../user-service-release.tar.gz .
          echo "==> Package release created successfully!"

      # Step 4: Transfer artifact to EC2 server
      - name: Copy Package Payload via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "user-service-release.tar.gz"
          target: "/tmp"

      # Step 5: Execute remote deployment script via SSH
      - name: Execute Automated Remote Server Update
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            /home/ubuntu/ApexFit/services/deploy/user-service.sh
