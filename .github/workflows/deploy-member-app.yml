name: Deploy Member-APP to EC2 ApexFit

# ------------------------------------------------------------------------------
# TRIGGER MANAGEMENT
# Pipeline fires automatically when code changes are pushed to 'main' branch 
# within the '/frontend/member-app' folder or this workflow file.
# ------------------------------------------------------------------------------
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/member-app/**' # Update path to match your frontend directory
      - '.github/workflows/deploy-member-app.yml'

jobs:
  # ------------------------------------------------------------------------------
  # CI/CD COMBINED PHASE
  # Runs on a single runner to build, package, transport, and deploy in one flow.
  # ------------------------------------------------------------------------------
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Pull source code
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # Step 2: Configure Node.js runtime
      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/member-app/package-lock.json

      # Step 3: Install all dependencies, compile frontend, and archive static build
      - name: Build & Package Frontend Build
        run: |
          echo "==> [Step 1/3] Installing dependencies and building production assets..."
          cd frontend/member-app
          npm ci
          npm run build
          
          echo "==> [Step 2/3] Packaging compiled static assets (dist)..."
          # Compiles dist directory into tar.gz
          tar -czf ../../member-app-release.tar.gz -C dist .
          echo "==> Package release created successfully!"

      # Step 4: Transfer compiled static bundle to EC2 server
      - name: Copy Package Payload via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "member-app-release.tar.gz"
          target: "/tmp"

      # Step 5: Execute remote deployment script via SSH (Extract assets & reload Nginx)
      - name: Execute Automated Remote Server Update
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            /home/ubuntu/ApexFit/frontend/deploy/member-app.sh
